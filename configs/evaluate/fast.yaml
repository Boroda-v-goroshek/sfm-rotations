defaults:
  - main
  - _self_

geometry:
  neighbors: 20  # Количество ближайших соседей по эмбеддингам для сопоставления
  max_keypoints: 2048  # Максимальное число ключевых точек ALIKED на кадр
  resize: 1024  # Размер большей стороны изображения при детекции признаков
  min_matches: 15  # Минимальное число подтверждённых совпадений для триангуляции пары
  num_threads: -1  # Число потоков CPU для сопоставления и маппинга (-1: все ядра)
  share_intrinsics: false  # Разделять внутренние параметры камеры между снимками
  random_seed: -1  # Random seed для RANSAC/COLMAP (-1: недетерминированный)
  mapping_trials: 1  # Количество попыток маппинга COLMAP с разных начальных пар
  compact_same_resolution: false  # Использовать компактный экстрактор при одинаковом разрешении
