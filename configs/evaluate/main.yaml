# Базовая конфигурация валидации геометрических поз (COLMAP)
data_root: data  # Корневая папка с данными для оценки
checkpoint: checkpoints/baseline/best.pt  # Чекпоинт для извлечения эмбеддингов и порогов кластеризации
metrics_path: geometry_metrics.json  # Путь для сохранения итоговых геометрических метрик
batch_size: 32  # Размер батча при извлечении эмбеддингов DINOv2
