[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sfm-rotations"
version = "0.0.1"
description = "Structure from Motion"
authors = [{ name = "aboba@boba" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
]

[dependency-groups]
dev = [
  "pre-commit>=4.0.1",
  "pytest",
  "pytest-cov",
  "ruff",
  "commitizen",
  "pyright",
]

[tool.ruff]
line-length = 120
exclude = ["*.yaml", "*.yml",]

[tool.ruff.lint]
select = [
  "I",
  "E",
  "W",
  "F",
  "N",
  "D",
  "PL",
  "S",
  "Q",
  "B",
  "SIM",
  "UP",
]

ignore = [
  "PLC0414",
  "PLC0415",
  "D105",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D107",
  "D205",
  "D212",
  "D401",
  "B008",
  "B904",
  "PLR0913",
  "PLR0911",
  "PLR0915",
  "PLR2004",
  "SIM105",
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"**/{tests}/*" = [
  "S101",
  "S108",
  "PLR2004",
  "E731",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "E722",
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.yamlfix]
line_length = 120
explicit_start = false
sequence_style = "keep_style"
whitelines = 1
section_whitelines = 1

[tool.pyright]
venvPath = "."
venv = ".venv"
reportPrivateImportUsage = false
reportIndexIssue = false
reportCallIssue = "warning"
reportMissingImports = "warning"
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
